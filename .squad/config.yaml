version: 1
project:
  name: Support Desk
  primaryLanguage: JavaScript
  projectRoots:
    - api
    - web
    - android
tracker:
  type: jira
  workspace: mazen-al-nabarawy.atlassian.net
  project: CRM
naming:
  includeTrackerId: false
  globalSequence: false
agents:
  - claude-code
planner:
  enabled: true
  provider: anthropic
  mode: auto
  auth:
    anthropic: subscription
  budget:
    # Deliberately below squad-kit's hardcoded 40-turn planner ceiling
    # (DEFAULT_PLANNER_MAX_ITERATIONS, which no flag or config key exposes).
    # Every file read costs a turn, so a read budget equal to the turn budget
    # can spend the whole allowance before the plan is written — which is how
    # CRM-27's first attempt died. 24 leaves roughly a third of the turns for
    # reasoning and writing, and matches the scout's own maxFiles.
    maxFileReads: 24
    maxContextBytes: 150000
    maxDurationSeconds: 360
  cache:
    enabled: true
  maxOutputTokens: 16384
  stages:
    scout:
      enabled: true
      maxFiles: 24
      maxOutputTokens: 2048
  tools:
    grep: true
    listDir: true
    rangedRead: true
  validation:
    enabled: true
    strict: false
  runtime:
    anthropic: agent-sdk
  providerOptions:
    anthropic:
      thinking: adaptive
      effort: medium
      effortByPhase:
        scout: minimal
        draft: medium
